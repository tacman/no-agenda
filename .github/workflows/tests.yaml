name: Run Tests

on: push

permissions:
  contents: read

env:
  APP_ENV: test
  APP_STORAGE_PATH: "${{ github.workspace }}/tests/fixtures"
  DATABASE_URL: postgresql://no_agenda:no_agenda@127.0.0.1:5432/no_agenda?serverVersion=18&charset=utf8
  SYMFONY_DEPRECATIONS_HELPER: disabled

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']
    services:
      database:
        image: postgres:18
        env:
          POSTGRES_DB: no_agenda_test
          POSTGRES_USER: no_agenda
          POSTGRES_PASSWORD: no_agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U no_agenda -d no_agenda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: imagick, pdo_pgsql
          tools: composer:v2
      -
        name: Set Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      -
        name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ matrix.php-version }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ matrix.php-version }}-composer-
      -
        name: Install Composer dependencies
        run: composer install --no-progress
      -
        name: Set up database
        run: |
          bin/console doctrine:migrations:migrate --no-interaction
          bin/console messenger:setup-transports
          bin/console doctrine:fixtures:load --no-interaction
      -
        name: Compile AssetMapper assets
        run: bin/console asset-map:compile
      -
        name: Run PHP tests
        run: vendor/bin/phpunit
      -
        name: Set up Node for native JavaScript tests
        uses: actions/setup-node@v4
        with:
          node-version: 24
      -
        name: Run JavaScript tests (no npm)
        run: node --test assets/tests/*.test.js
